name: CI-Scala
on:
  pull_request:
  workflow_dispatch:
  push:
    branches:
      - main

# Ensure we only ever have one build running at a time.
# If we push twice in quick succession, the first build will be stopped once the second starts.
# This avoids multiple deploys happening in quick succession causing AWS rate exceeded errors.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gu-cdk-build:
    strategy:
      fail-fast: false
      matrix:
        subproject:
          - batch-email-sender
          - cancellation-sf-cases-api
          - holiday-stop-processor
          - delivery-problem-credit-processor
          - new-product-api
          - sf-emails-to-s3-exporter
          - sf-move-subscriptions-api
          - single-contribution-salesforce-writes
          - stripe-webhook-endpoints
          - soft-opt-in-consent-setter
          - zuora-auto-cancel
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Java
        uses: actions/setup-java@v6.0.1
        with:
          distribution: 'corretto'
          java-version: '21'
          check-latest: true
          cache: 'sbt'

      - name: Setup SBT
        uses: sbt/setup-sbt@v1.5.11

      - name: Run tests and build subproject JAR
        run: sbt "project ${{ matrix.subproject }}" test assembly
      - run: npm install --global corepack@0.31.0
      - run: corepack enable
        shell: bash
      - uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'
      - run: pnpm install
      - run: pnpm --filter cdk package

      - name: Upload to Riff-Raff
        uses: guardian/actions-riff-raff@v4.3.3
        with:
          githubToken: ${{ secrets.GITHUB_TOKEN }}
          roleArn: ${{ secrets.GU_RIFF_RAFF_ROLE_ARN }}
          projectName: support-service-lambdas::${{ matrix.subproject }}
          buildNumberOffset: 7000
          configPath: ./handlers/${{ matrix.subproject }}/riff-raff.yaml
          commentingEnabled: 'false'
          contentDirectories: |
            ${{ matrix.subproject }}-cloudformation:
              - ./cdk/cdk.out/${{ matrix.subproject }}-CODE.template.json
              - ./cdk/cdk.out/${{ matrix.subproject }}-PROD.template.json
            ${{ matrix.subproject }}:
              - /tmp/${{ matrix.subproject }}.jar
  build:
    strategy:
      fail-fast: false
      matrix:
        subproject:
          - catalog-service
          - contact-us-api
          - delivery-records-api
          - dev-env-cleaner
          - digital-subscription-expiry
          - digital-voucher-api
          - digital-voucher-cancellation-processor
          - digital-voucher-suspension-processor
          - fulfilment-date-calculator
          - holiday-stop-api
          - identity-backfill
          - identity-retention
          - product-move-api
          - sf-contact-merge
          - sf-datalake-export
          - sf-gocardless-sync
          - zuora-datalake-export
          - zuora-rer
          - zuora-sar
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Java
        uses: actions/setup-java@v6.0.1
        with:
          distribution: 'corretto'
          java-version: '21'
          check-latest: true
          cache: 'sbt'

      - name: Setup SBT
        uses: sbt/setup-sbt@v1.5.11

      - name: run tests and Build jar
        run: sbt "project ${{ matrix.subproject }}" test assembly

      - name: Upload to Riff-Raff
        uses: guardian/actions-riff-raff@v4.3.3
        with:
          githubToken: ${{ secrets.GITHUB_TOKEN }}
          roleArn: ${{ secrets.GU_RIFF_RAFF_ROLE_ARN }}
          projectName: support-service-lambdas::${{ matrix.subproject }}
          buildNumberOffset: 6410
          configPath: ./handlers/${{ matrix.subproject }}/riff-raff.yaml
          commentingEnabled: 'false'
          contentDirectories: |
            ${{ matrix.subproject }}:
              - /tmp/${{ matrix.subproject }}.jar
            cfn:
              - handlers/${{ matrix.subproject }}/cfn.yaml

  # for branch protection - only passes if all builds pass
  ci-scala-all:
    name: ci-scala-all
    runs-on: ubuntu-latest
    permissions: {}
    if: ${{ always() }}
    needs:
      - gu-cdk-build
      - build
    steps:
      - name: Fail unless all Scala CI jobs succeeded
        run: |
          [ "${{ needs.gu-cdk-build.result }}" = "success" ]
          [ "${{ needs.build.result }}" = "success" ]
