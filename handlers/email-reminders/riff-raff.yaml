# MANAGED FILE: to push changes see buildcheck/README.md - template: buildcheck/data/templates/handler/riff-raff.yaml.ts
stacks:
  - support
regions:
  - eu-west-1
allowedStages:
  - CODE
  - PROD
deployments:
  email-reminders-cloudformation:
    type: cloud-formation
    app: email-reminders
    parameters:
      templateStagePaths:
        CODE: email-reminders-CODE.template.json
        PROD: email-reminders-PROD.template.json
  email-reminders:
    type: aws-lambda
    parameters:
      fileName: email-reminders.zip
      bucketSsmLookup: true
      prefixStack: false
      functionNames:
        - email-reminders-
        - email-reminders-processor-
    dependencies:
      - email-reminders-cloudformation
