# MANAGED FILE: to push changes see buildcheck/README.md - template: buildcheck/data/templates/handler/riff-raff.yaml.ts
stacks:
  - support
regions:
  - eu-west-1
allowedStages:
  - CODE
  - PROD
deployments:
  cancellation-api-cloudformation:
    type: cloud-formation
    app: cancellation-api
    parameters:
      templateStagePaths:
        CODE: cancellation-api-CODE.template.json
        PROD: cancellation-api-PROD.template.json
  cancellation-api:
    type: aws-lambda
    parameters:
      fileName: cancellation-api.zip
      bucketSsmLookup: true
      prefixStack: false
      functionNames:
        - cancellation-api-
        - cancellation-api-refund-generate-cancellation-invoice-
        - cancellation-api-refund-calculate-refund-
        - cancellation-api-refund-check-payment-settlement-
        - cancellation-api-refund-create-refund-
        - cancellation-api-refund-balance-invoices-
        - cancellation-api-refund-get-cancellation-reason-
        - cancellation-api-refund-backdate-cancellation-
        - cancellation-api-refund-send-payment-failed-email-
    dependencies:
      - cancellation-api-cloudformation
