# MANAGED FILE: to push changes see buildcheck/README.md - template: buildcheck/data/templates/handler/riff-raff.yaml.ts
stacks:
  - support
regions:
  - eu-west-1
allowedStages:
  - CODE
  - PROD
deployments:
  promotions-api-cloudformation:
    type: cloud-formation
    app: promotions-api
    parameters:
      templateStagePaths:
        CODE: promotions-api-CODE.template.json
        PROD: promotions-api-PROD.template.json
  promotions-api:
    type: aws-lambda
    parameters:
      fileName: promotions-api.zip
      bucketSsmLookup: true
      prefixStack: false
      functionNames:
        - promotions-api-
    dependencies:
      - promotions-api-cloudformation
