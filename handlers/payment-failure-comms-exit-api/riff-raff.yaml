# MANAGED FILE: to push changes see buildcheck/README.md - template: buildcheck/data/templates/handler/riff-raff.yaml.ts
stacks:
  - support
regions:
  - eu-west-1
allowedStages:
  - CODE
  - PROD
deployments:
  payment-failure-comms-exit-api-cloudformation:
    type: cloud-formation
    app: payment-failure-comms-exit-api
    parameters:
      templateStagePaths:
        CODE: payment-failure-comms-exit-api-CODE.template.json
        PROD: payment-failure-comms-exit-api-PROD.template.json
  payment-failure-comms-exit-api:
    type: aws-lambda
    parameters:
      fileName: payment-failure-comms-exit-api.zip
      bucketSsmLookup: true
      prefixStack: false
      functionNames:
        - payment-failure-comms-exit-api-
    dependencies:
      - payment-failure-comms-exit-api-cloudformation
