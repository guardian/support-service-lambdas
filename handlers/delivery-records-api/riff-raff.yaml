stacks:
  - membership
regions:
  - eu-west-1
allowedStages:
  - CODE
  - PROD
deployments:
  delivery-records-api-cloudformation:
    type: cloud-formation
    app: delivery-records-api
    parameters:
      templateStagePaths:
        CODE: delivery-records-api-CODE.template.json
        PROD: delivery-records-api-PROD.template.json

  delivery-records-api:
    type: aws-lambda
    parameters:
      fileName: delivery-records-api.jar
      bucketSsmLookup: true
      prefixStack: false
      functionNames:
        - delivery-records-api-CODE
        - delivery-records-api-PROD
    dependencies: [delivery-records-api-cloudformation]
