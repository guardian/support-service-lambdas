# MANAGED FILE: to push changes see buildcheck/README.md - template: buildcheck/data/templates/handler/riff-raff.yaml.ts
stacks:
  - support
regions:
  - eu-west-1
allowedStages:
  - CODE
  - PROD
deployments:
  slot-spend-cloudformation:
    type: cloud-formation
    app: slot-spend
    parameters:
      templateStagePaths:
        CODE: slot-spend-CODE.template.json
        PROD: slot-spend-PROD.template.json
  slot-spend:
    type: aws-lambda
    parameters:
      fileName: slot-spend.zip
      bucketSsmLookup: true
      prefixStack: false
      functionNames:
        - slot-spend-query-
        - slot-spend-update-
    dependencies:
      - slot-spend-cloudformation
