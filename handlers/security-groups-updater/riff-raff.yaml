# MANAGED FILE: to push changes see buildcheck/README.md - template: buildcheck/data/templates/handler/riff-raff.yaml.ts
stacks:
  - support
regions:
  - eu-west-1
allowedStages:
  - CODE
  - PROD
deployments:
  security-groups-updater-cloudformation:
    type: cloud-formation
    app: security-groups-updater
    parameters:
      templateStagePaths:
        CODE: security-groups-updater-CODE.template.json
        PROD: security-groups-updater-PROD.template.json
  security-groups-updater:
    type: aws-lambda
    parameters:
      fileName: security-groups-updater.zip
      bucketSsmLookup: true
      prefixStack: false
      functionNames:
        - security-groups-updater-
    dependencies:
      - security-groups-updater-cloudformation
