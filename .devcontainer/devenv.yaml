# Devenv project configuration
# Edit this file to configure your project's devcontainer
# and then run `devenv generate` to create the devcontainer.json files

# REQUIRED: Change this to your project name
name: "support-service-lambdas"

# Modules: Built-in functionality
# - mise: Install and configure mise for dev tools management (https://mise.jdx.dev/)
# - docker-in-docker: Enable running Docker containers within the devcontainer
# - scala: Add IDE plugins and jar caching for Scala development
# - node: Add IDE plugins for Node.js development
# - github-copilot: Sets up GitHub Copilot for IDE and CLI use (requires the mise module)
# To disable, comment out or remove items from this list
modules:
  - mise
  # - docker-in-docker  # (disabled by default) - enable if your tests need Docker (e.g. localstack/testcontainers)
  - scala
  - node
  - github-copilot

# Optional: Ports to forward
# forwardPorts:
#   - 8080  # same port on host and container
#   - "8000:9000"  # hostPort:containerPort

# Optional: Mount directories from host to container
# mounts:
#   - "source=${localEnv:HOME}/.gu/example,target=/home/vscode/.gu/example,readonly,type=bind,consistency=cached"
mounts:
  # Give the container its own node_modules (a named volume) rather than reusing
  # the host's. The host is macOS but the container is Linux, so packages with
  # native/platform-specific binaries (e.g. esbuild, and pnpm's .pnpm store) must
  # be installed for Linux. This also speeds up file I/O vs a bind-mounted
  # node_modules on macOS. It is populated by `pnpm install` in postCreateCommand.
  - "source=support-service-lambdas-node-modules-volume,target=${containerWorkspaceFolder}/node_modules,type=volume"
  # Give the container its own .idea (a named volume) so the in-container IntelliJ
  # doesn't share IDE config with a host IntelliJ opened on the same repo. The repo
  # is bind-mounted, so without this both IDEs write to the same .idea and clobber
  # each other's Project JDK (e.g. "JDK ... (mise) is missing"). This lets you run
  # both IDEs at once (e.g. editing devcontainer files on the host while launching
  # the container from it).
  - "source=support-service-lambdas-idea-volume,target=${containerWorkspaceFolder}/.idea,type=volume"

# Optional: IDE plugins - shared project plugins like language support
# plugins:
#   vscode: []
#   intellij: []

# Optional: Commands to run after container creation
# Each command has a 'cmd' field and a 'workingDirectory' field
# e.g.
postCreateCommand:
  - cmd: 'mise install'
    workingDirectory: '.'
  - cmd: 'mise exec -- node --version'
    workingDirectory: '.'
  - cmd: 'mise exec -- corepack enable'
    workingDirectory: '.'
  - cmd: 'sudo chown -R "$(whoami):$(whoami)" node_modules'
    workingDirectory: '.'
  # The .idea directory is a named volume (see mounts above) so the container gets its
  # own IntelliJ config. A fresh volume is owned by root, so take ownership as the
  # container user before the IDE tries to write to it.
  - cmd: 'sudo chown -R "$(whoami):$(whoami)" .idea'
    workingDirectory: '.'
  - cmd: 'mise exec -- pnpm install'
    workingDirectory: '.'
